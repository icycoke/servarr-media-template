services:
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}       - TZ=${TZ:-America/New_York}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${CONFIG_DIR:-/home/user/servarr/config}/bazarr:/config
      - ${MEDIA_DIR:-/mnt/storage}:/media
    ports:
      - "6767:6767"
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}       - TZ=${TZ:-America/New_York}
    volumes:
      - ${CONFIG_DIR:-/home/user/servarr/config}/prowlarr:/config
    ports:
      - "9696:9696"
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}       - TZ=${TZ:-America/New_York}
    volumes:
      - ${CONFIG_DIR:-/home/user/servarr/config}/radarr:/config
      - ${MEDIA_DIR:-/mnt/storage}/downloads:/media/downloads
      - ${MEDIA_DIR:-/mnt/storage}/movies:/media/movies
    ports:
      - "7878:7878"
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}       - TZ=${TZ:-America/New_York}
    volumes:
      - ${CONFIG_DIR:-/home/user/servarr/config}/sonarr:/config
      - ${MEDIA_DIR:-/mnt/storage}/downloads:/media/downloads
      - ${MEDIA_DIR:-/mnt/storage}/tv-shows:/media/tv-shows
      - ${MEDIA_DIR:-/mnt/storage}/anime:/media/anime
    ports:
      - "8989:8989"
    restart: unless-stopped

  rdtclient:
    image: rogerfar/rdtclient:latest
    container_name: rdtclient
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}       - TZ=${TZ:-America/New_York}
    volumes:
      - ${CONFIG_DIR:-/home/user/servarr/config}/rdtclient/db:/data/db
      - ${MEDIA_DIR:-/mnt/storage}/downloads:/media/downloads
    ports:
      - "6500:6500"
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ:-America/New_York}
    ports:
      - "8191:8191"
    restart: unless-stopped

  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    user: ${PUID:-1000}:${PGID:-1000}
    network_mode: host
    environment:
      - TZ=${TZ:-America/New_York}
    volumes:
      - ${CONFIG_DIR:-/home/user/servarr/config}/jellyfin:/config
      - ${MEDIA_DIR:-/mnt/storage}:/media
    restart: unless-stopped

  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    environment:
      - LOG_LEVEL=debug
      - TZ=${TZ:-America/New_York}
    volumes:
      - ${CONFIG_DIR:-/home/user/servarr/config}/jellyseerr:/app/config
    ports:
      - "5055:5055"
    restart: unless-stopped

  queue-cleaner:
    image: python:3.11-alpine
    container_name: queue-cleaner
    restart: unless-stopped
    volumes:
      - ./scripts:/scripts:ro
      - ${CONFIG_DIR:-/home/user/servarr/config}/homepage:/config
    environment:
      - TZ=${TZ:-America/New_York}
      - PYTHONUNBUFFERED=1
      - SONARR_URL=http://sonarr:8989
      - RADARR_URL=http://radarr:7878
      - LIDARR_URL=http://lidarr:8686
      - SONARR_API_KEY=${SONARR_API_KEY:-}
      - RADARR_API_KEY=${RADARR_API_KEY:-}
      - LIDARR_API_KEY=${LIDARR_API_KEY:-}
      - QUEUE_STUCK_TIMEOUT=900
      - CHECK_INTERVAL=300
    command: sh -c "apk add --no-cache tzdata && pip install --no-cache-dir requests && python -u /scripts/queue_cleaner.py"

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}       - TZ=${TZ:-America/New_York}
      - HOMEPAGE_VAR_SERVER_IP=${SERVER_IP:-127.0.0.1}
      - HOMEPAGE_VAR_HOST_IP=${HOST_IP:-127.0.0.1}
      - HOMEPAGE_ALLOWED_HOSTS=*
    volumes:
      - ${CONFIG_DIR:-/home/user/servarr/config}/homepage:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${MEDIA_DIR:-/mnt/storage}:/media:ro
    ports:
      - "3000:3000"
    restart: unless-stopped

  unpackerr:
    image: golift/unpackerr:latest
    container_name: unpackerr
    restart: unless-stopped
    volumes:
      - ${MEDIA_DIR:-/mnt/storage}/downloads:/media/downloads
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}       - TZ=${TZ:-America/New_York}
      - UN_INTERVAL=15s
      - UN_START_DELAY=0s
      - UN_DEBUG=false
      - UN_FOLDER_0_PATH=/media/downloads/sonarr
      - UN_FOLDER_0_EXTRACT_PATH=
      - UN_FOLDER_0_MOVE_BACK=true
      - UN_FOLDER_0_DELETE_FILES=true
      - UN_FOLDER_0_DELETE_AFTER=1m
      - UN_FOLDER_1_PATH=/media/downloads/radarr
      - UN_FOLDER_1_EXTRACT_PATH=
      - UN_FOLDER_1_MOVE_BACK=true
      - UN_FOLDER_1_DELETE_FILES=true
      - UN_FOLDER_1_DELETE_AFTER=1m
      - UN_FOLDER_2_PATH=/media/downloads/lidarr
      - UN_FOLDER_2_EXTRACT_PATH=
      - UN_FOLDER_2_MOVE_BACK=true
      - UN_FOLDER_2_DELETE_FILES=true
      - UN_FOLDER_2_DELETE_AFTER=1m

  prowlarr-limiter:
    image: nginx:alpine
    container_name: prowlarr-limiter
    restart: unless-stopped
    volumes:
      - ./config/prowlarr-limiter/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "9697:9697"

  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}       - TZ=${TZ:-America/New_York}
    volumes:
      - ${CONFIG_DIR:-/home/user/servarr/config}/lidarr:/config
      - ${MEDIA_DIR:-/mnt/storage}/downloads:/media/downloads
      - ${MEDIA_DIR:-/mnt/storage}/music:/media/music
    ports:
      - "8686:8686"
    restart: unless-stopped

  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    user: ${PUID:-1000}:${PGID:-1000}
    environment:
      - TZ=${TZ:-America/New_York}
      - ND_SCANSCHEDULE=1h
      - ND_LOGLEVEL=info
      - ND_SESSIONTIMEOUT=24h
      - ND_ENABLETRANSCODINGCONFIG=true
    volumes:
      - ${CONFIG_DIR:-/home/user/servarr/config}/navidrome:/data
      - ${MEDIA_DIR:-/mnt/storage}/music:/music:ro
    ports:
      - "4533:4533"
    restart: unless-stopped
