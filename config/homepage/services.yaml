- Automation & Infrastructure:
    - FlareSolverr:
        icon: flaresolverr.png
        href: "http://{{HOMEPAGE_VAR_SERVER_IP}}:8191"
        description: "Cloudflare anti-bot bypass proxy"
    - Unpackerr:
        icon: unpackerr.png
        href: "http://{{HOMEPAGE_VAR_SERVER_IP}}:8282"
        description: "Archive extraction & cleanup daemon"
    - Prowlarr Limiter Gateway:
        icon: nginx.png
        href: "http://prowlarr:9696"
        description: "API rate-limiting gateway"
        widget:
          type: customapi
          url: "http://prowlarr-limiter:9697/status"
          refreshInterval: 3000
          display: list
          mappings:
            - field: active
              label: "Active Connections"
            - field: writing
              label: "Traffic Shaping"
            - field: rate
              label: "Drain Rate"
            - field: cache
              label: "Cache Hits"
    - Queue Cleaner:
        icon: mdi-broom
        description: "Servarr stalled item auto-purger"
        widget:
          type: customapi
          url: "http://queue-cleaner:5000"
          refreshInterval: 5000
          display: list
          mappings:
            - field: status
              label: "Status"
            - field: last_check
              label: "Last Inspected"
            - field: event_1
              label: "Log 1"
            - field: event_2
              label: "Log 2"
            - field: event_3
              label: "Log 3"
            - field: event_4
              label: "Log 4"
            - field: event_5
              label: "Log 5"
